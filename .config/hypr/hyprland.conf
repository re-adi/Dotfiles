
###############
### INCLUDE ###
###############

source = ~/.config/hypr/keybinds.conf
source = ~/.cache/wal/colors-hyprland.conf

################
### MONITORS ###
################

monitor = VGA-1, 1366x766@60, 0x0, 1, transform, 0

# monitor = name, disable
# monitor = name, preferred, auto, 1, mirror, <NAME>
# monitor = name, addreserved, TOP, BOTTOM, LEFT, RIGHT  # reserve area

#################
### AUTOSTART ###
#################

# core
exec-once = ~/.scripts/reset-portals.sh
exec-once = wal -R
exec-once = swww-daemon --format xrgb
exec-once = waybar
exec-once = dunst
exec-once = hyprsunset
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# extra
# exec-once = hyprsysteminfo
exec-once = udiskie --no-automount --smart-tray
# exec-once = kitty --hold "/usr/local/bin/fetch"

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,16
env = HYPRCURSOR_SIZE,16
env = XCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_THEME,Bibata-Modern-Classic

env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

env = GDK_SCALE,1
env = GDK_BACKEND,wayland,x11,*

env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

env = ELECTRON_OZONE_PLATFORM_HINT,wayland

#####################
### LOOK AND FEEL ###
#####################

general {
	gaps_in = 2
	gaps_out = 6
	border_size = 2
	col.active_border = $color1
	# col.inactive_border = $background
	resize_on_border = false
	no_focus_fallback = true
	allow_tearing = false
	layout = master
}

dwindle {
	preserve_split = true
	default_split_ratio = 1.2
	split_bias = 2
}

master {
	mfact = 0.6
	new_status = slave
	smart_resizing = false
}

decoration {
	rounding = 5
	# active_opacity = 0.82
	# inactive_opacity = 0.2
	# dim_special = 0.4
	# border_part_of_window = false
	blur {
		enabled = false
		size = 1
		passes = 6
		vibrancy = 0.85
		popups = false
		popups_ignorealpha = 0.0
	}
	shadow {
		enabled = false
		range = 20
		render_power = 3
		color = $color1
		color_inactive = $background
	}
}

group {
    groupbar {
	enabled = true
	gradients = true
	render_titles = true
	keep_upper_gap = false
	height = 15
	indicator_gap = -6
	gaps_in = 2
	gaps_out = 8
	gradient_rounding = 4
	round_only_edges = false
	gradient_round_only_edges = false
	font_family = Space Grotesk
	font_size = 10
	font_weight_active = bold
	text_color = $background
	col.active = $foreground
	col.inactive = $color1
    }
}

##################
### Animations ###
##################

animations {
    enabled = yes, # Thanks https://github.com/sansroot :)
        bezier = wind, 0.05, 0.9, 0.1, 1.05
        bezier = winIn, 0.1, 1.1, 0.1, 1.1
        bezier = winOut, 0.3, -0.3, 0, 1
        bezier = liner, 1, 1, 1, 1
        bezier = overshot, 0.05, 0.9, 0.1, 1.05
        bezier = smoothOut, 0.5, 0, 0.99, 0.99
        bezier = smoothIn, 0.5, -0.5, 0.68, 1.5
        bezier = easeOutQuint,0.23,1,0.32,1
        bezier = easeInOutCubic,0.65,0.05,0.36,1 
        bezier = linear,0,0,1,1
        bezier = almostLinear,0.5,0.5,0.75,1.0
        bezier = quick,0.05,0,0.1,1
        animation = windows, 1, 6, wind, slide
        animation = windowsIn, 1, 5, winIn, slide
        animation = windowsOut, 1, 3, smoothOut, slide
        animation = windowsMove, 1, 5, wind, slide
        animation = border, 1, 1, liner
        animation = borderangle, 1, 180, liner, loop 
        animation = fade, 1, 3, smoothOut
        animation = workspaces, 1, 5, overshot
        animation = workspacesIn, 1, 5, winIn, slide
        animation = workspacesOut, 1, 5, winOut, slide
        animation = layers, 1, 3.81, easeOutQuint 
        animation = layersIn, 1, 4, easeOutQuint, popin 80%
        animation = layersOut, 1, 3, easeOutQuint, slide
    workspace_wraparound = false
}

#############
### INPUT ###
#############

input {
	accel_profile = adaptive
	sensitivity = 0.2 # -1.0 to 1.0
	numlock_by_default = true
}

cursor {
	inactive_timeout = 5
	no_warps = true
	enable_hyprcursor = true
	sync_gsettings_theme = true
}

##############################
### WINDOWS AND WORKSPACES ###
##############################

binds {
	hide_special_on_workspace_change = true
}

misc {
	font_family = Space Grotesk
	animate_manual_resizes = true
	animate_mouse_windowdragging = true
	new_window_takes_over_fullscreen = 2
	middle_click_paste = false
	enable_anr_dialog = false
	anr_missed_pings = 10
	force_default_wallpaper = 0
	disable_hyprland_logo = true
}

xwayland {
	enabled = false
	force_zero_scaling = true
}

ecosystem {
	no_update_news = false
	no_donation_nag = true
	enforce_permissions = false
}

###################
### LAYER RULES ###
###################

# menus
layerrule = dimaround, ^(rofi)$
layerrule = dimaround, ^(launcher)$

# screenshot
layerrule = animation layersOut 0, ^(selection)$
layerrule = animation layersOut 0, ^(hyprpicker)$

####################
### WINDOW RULES ###
####################

windowrulev2 = suppressevent maximize, class:.*
# windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
